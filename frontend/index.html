<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaPulse-A 量化交易系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e1e4e8;display:flex;min-height:100vh}
.sidebar{width:200px;background:#161b22;border-right:1px solid #30363d;padding:12px 0;flex-shrink:0;display:flex;flex-direction:column}
.sidebar h2{color:#58a6ff;font-size:15px;padding:8px 16px;margin-bottom:4px}
.sidebar .ver{color:#8b949e;font-size:11px;padding:0 16px 12px}
.sidebar nav a{display:block;padding:9px 16px;color:#8b949e;text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
.sidebar nav a:hover,.sidebar nav a.active{color:#e1e4e8;background:#1c2129;border-left-color:#58a6ff}
.sidebar .status{color:#3fb950;font-size:11px;padding:12px 16px;border-top:1px solid #30363d}
.main{flex:1;padding:20px;overflow-y:auto;max-height:100vh}
.panel{display:none}
.panel.active{display:block}
.panel h3{color:#58a6ff;font-size:17px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #30363d}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.col{flex:1;min-width:140px}
label{display:block;font-size:12px;color:#8b949e;margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;background:#0d1117;border:1px solid #30363d;border-radius:5px;color:#e1e4e8;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#58a6ff}
button{padding:8px 16px;background:#238636;border:none;border-radius:5px;color:#fff;font-size:13px;cursor:pointer}
button:hover{background:#2ea043}
button.sm{font-size:11px;padding:4px 10px}
button.s2{background:#30363d}
button.s2:hover{background:#484f58}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.mc{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;text-align:center}
.mc .v{font-size:24px;font-weight:700;color:#58a6ff}
.mc .l{font-size:11px;color:#8b949e;margin-top:2px}
.mc.ok .v{color:#3fb950}
.mc.warn .v{color:#d29922}
.mc.bad .v{color:#f85149}
.chart-wrap{position:relative;height:300px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 10px;background:#21262d;color:#8b949e;font-weight:600}
td{padding:6px 10px;border-top:1px solid #30363d}
tr:hover{background:#1c2129}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.bg-core{background:#1f6feb33;color:#58a6ff}
.bg-sel{background:#23863633;color:#3fb950}
.bg-ind{background:#d2992233;color:#d29922}
.bg-exp{background:#da363333;color:#f85149}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading{color:#d29922;font-size:13px;margin:12px 0}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:6px;color:#fff;font-size:13px;z-index:999}
.toast.ok{background:#238636}
.toast.err{background:#da3633}
</style>
</head>
<body>

<div class="sidebar">
  <h2>AlphaPulse-A</h2>
  <div class="ver">v2.0 · 量化选股系统</div>
  <nav>
    <a class="active" data-panel="dash">&#x1F4CA; 仪表盘</a>
    <a data-panel="screen">&#x1F50D; 选股扫描</a>
    <a data-panel="backtest">&#x1F4C8; 回测中心</a>
    <a data-panel="factors">&#x1F9EC; 因子体系</a>
    <a data-panel="cases">&#x1F3AF; 案例检测</a>
    <a data-panel="risk">&#x1F6E1; 风控状态</a>
  </nav>
  <div class="status" id="sys-status">● 系统就绪</div>
</div>

<div class="main">

<!-- ====== DASHBOARD ====== -->
<div id="panel-dash" class="panel active">
  <h3>&#x1F4CA; 系统仪表盘</h3>
  <div class="metrics" id="dash-metrics"></div>
  <h4 style="margin-top:16px;color:#8b949e">回测历史对比</h4>
  <table id="dash-history"><thead><tr><th>策略</th><th>年化收益%</th><th>最大回撤%</th><th>Sharpe</th><th>交易数</th></tr></thead><tbody></tbody></table>
</div>

<!-- ====== SCREENER ====== -->
<div id="panel-screen" class="panel">
  <h3>&#x1F50D; 选股扫描</h3>
  <div class="row">
    <div class="col"><label>样本数</label><select id="sc-n"><option value="100">100只</option><option value="200" selected>200只</option><option value="300">300只</option></select></div>
    <div class="col"><label>&nbsp;</label><button onclick="runScreener()">&#x25B6; 开始扫描</button></div>
  </div>
  <div id="sc-loading" class="loading" style="display:none">&#x23F3; 扫描中（约30-60秒）...</div>
  <div id="sc-results"></div>
</div>

<!-- ====== BACKTEST ====== -->
<div id="panel-backtest" class="panel">
  <h3>&#x1F4C8; 回测中心</h3>
  <div class="row">
    <div class="col"><label>策略</label><select id="bt-strat"><option value="B1_FORMULA">B1 多因子</option><option value="BRICK_ULTRA">砖型图超短</option><option value="NEEDLE_ENHANCED">单针增强</option></select></div>
    <div class="col"><label>样本数</label><select id="bt-n"><option value="50">50只</option><option value="100" selected>100只</option><option value="200">200只</option></select></div>
    <div class="col"><label>&nbsp;</label><button onclick="runBacktest()">&#x25B6; 运行回测</button></div>
  </div>
  <div id="bt-loading" class="loading" style="display:none">&#x23F3; 回测中...</div>
  <div id="bt-metrics" class="metrics" style="display:none"></div>
</div>

<!-- ====== FACTORS ====== -->
<div id="panel-factors" class="panel">
  <h3>&#x1F9EC; 因子体系 (23项)</h3>
  <table><thead><tr><th>名称</th><th>类型</th><th>描述</th><th>来源</th></tr></thead><tbody id="fac-table"></tbody></table>
</div>

<!-- ====== CASES ====== -->
<div id="panel-cases" class="panel">
  <h3>&#x1F3AF; 案例股检测</h3>
  <button onclick="runCaseCheck()">&#x25B6; 检测46只案例股</button>
  <div id="case-loading" class="loading" style="display:none">&#x23F3; 检测中...</div>
  <div id="case-results" style="margin-top:12px"></div>
</div>

<!-- ====== RISK ====== -->
<div id="panel-risk" class="panel">
  <h3>&#x1F6E1; 风控检查</h3>
  <button onclick="runRiskCheck()">&#x25B6; 刷新检查</button>
  <div id="risk-results" style="margin-top:12px"></div>
</div>

</div>

<script>
// ── Navigation ──
document.querySelectorAll('[data-panel]').forEach(a => {
  a.onclick = () => {
    document.querySelectorAll('[data-panel]').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + a.dataset.panel).classList.add('active');
    if (a.dataset.panel === 'dash') loadDashboard();
    if (a.dataset.panel === 'factors') loadFactors();
  };
});

// ── Toast ──
function toast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── API helpers ──
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}

// ── Dashboard ──
async function loadDashboard() {
  try {
    const info = await api('/api/info');
    document.getElementById('dash-metrics').innerHTML =
      `<div class="mc ok"><div class="v">${info.stocks}</div><div class="l">A股数据</div></div>` +
      `<div class="mc"><div class="v">${info.factors}</div><div class="l">因子</div></div>` +
      `<div class="mc"><div class="v">${info.strategies.length}</div><div class="l">策略</div></div>` +
      `<div class="mc"><div class="v">${info.version}</div><div class="l">版本</div></div>`;

    const hist = await api('/api/backtest_history');
    const tbody = document.querySelector('#dash-history tbody');
    tbody.innerHTML = hist.slice(0, 10).map(h =>
      `<tr><td>${h.strategy}</td><td>${h.annual_return ?? '...'}</td><td>${h.max_drawdown ?? '...'}</td><td>${h.sharpe ?? '...'}</td><td>${h.trades ?? '...'}</td></tr>`
    ).join('');

    document.getElementById('sys-status').innerHTML = '● 系统就绪 | ' + info.stocks + '只股票 | ' + info.date;
  } catch(e) { toast('无法连接服务器: ' + e.message, false); }
}

// ── Screener ──
async function runScreener() {
  document.getElementById('sc-loading').style.display = 'block';
  document.getElementById('sc-results').innerHTML = '';
  try {
    const n = document.getElementById('sc-n').value;
    const r = await api('/api/screen?sample=' + n);
    let html = `<p style="color:#8b949e;margin-bottom:8px">扫描 ${r.n_stocks} 只股票</p>`;
    for (const [sname, sdata] of Object.entries(r.strategies)) {
      html += `<h4 style="margin-top:12px;color:#58a6ff">${sname}: ${sdata.total_stocks_with_signals} 只有信号</h4>`;
      if (sdata.top10 && sdata.top10.length > 0) {
        html += '<table><thead><tr><th>代码</th><th>信号数</th></tr></thead><tbody>';
        sdata.top10.forEach(x => { html += `<tr><td>${x.symbol}</td><td>${x.signals}</td></tr>`; });
        html += '</tbody></table>';
      }
    }
    document.getElementById('sc-results').innerHTML = html;
    toast('扫描完成', true);
  } catch(e) { toast('扫描失败: ' + e.message, false); }
  document.getElementById('sc-loading').style.display = 'none';
}

// ── Backtest ──
async function runBacktest() {
  document.getElementById('bt-loading').style.display = 'block';
  document.getElementById('bt-metrics').style.display = 'none';
  try {
    const s = document.getElementById('bt-strat').value;
    const n = document.getElementById('bt-n').value;
    const r = await api('/api/backtest?strategy=' + s + '&sample=' + n);
    const m = r.metrics;
    document.getElementById('bt-metrics').innerHTML =
      `<div class="mc ok"><div class="v">${m.annual_return}%</div><div class="l">年化收益</div></div>` +
      `<div class="mc bad"><div class="v">${m.max_drawdown}%</div><div class="l">最大回撤</div></div>` +
      `<div class="mc"><div class="v">${m.sharpe_ratio}</div><div class="l">夏普比率</div></div>` +
      `<div class="mc"><div class="v">${m.win_rate}%</div><div class="l">胜率</div></div>` +
      `<div class="mc"><div class="v">${m.total_trades}</div><div class="l">交易次数</div></div>` +
      `<div class="mc"><div class="v">${m.calmar_ratio}</div><div class="l">Calmar</div></div>`;
    document.getElementById('bt-metrics').style.display = 'grid';
    toast(r.strategy + ' 回测完成', true);
  } catch(e) { toast('回测失败: ' + e.message, false); }
  document.getElementById('bt-loading').style.display = 'none';
}

// ── Factors ──
async function loadFactors() {
  try {
    const factors = await api('/api/factors');
    const typeMap = {core:'核心',selection:'选股',indicator:'指标',experimental:'实验'};
    const clsMap = {core:'bg-core',selection:'bg-sel',indicator:'bg-ind',experimental:'bg-exp'};
    document.getElementById('fac-table').innerHTML = factors.map(f =>
      `<tr><td>${f.name}</td><td><span class="badge ${clsMap[f.type]||'bg-core'}">${typeMap[f.type]||f.type}</span></td><td>${f.desc}</td><td style="font-size:11px;color:#8b949e">${f.source||''}</td></tr>`
    ).join('');
  } catch(e) { toast('加载因子失败', false); }
}

// ── Cases ──
async function runCaseCheck() {
  document.getElementById('case-loading').style.display = 'block';
  document.getElementById('case-results').innerHTML = '';
  try {
    const r = await api('/api/cases');
    let html = `<div style="margin-bottom:8px"><b>${r.detected}/${r.with_data}</b> 案例股被检测到 (${r.rate}%)</div>`;
    if (r.missing_data && r.missing_data.length > 0) html += `<div style="color:#d29922;font-size:12px">缺失数据: ${r.missing_data.join(', ')}</div>`;
    html += '<table style="margin-top:8px"><thead><tr><th>代码</th><th>检测策略</th></tr></thead><tbody>';
    for (const [sym, found] of Object.entries(r.details).sort((a,b) => b[1].length - a[1].length)) {
      html += `<tr><td>${sym}</td><td>${found.length>0 ? found.join(', ') : '<span style="color:#f85149">未检测</span>'}</td></tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('case-results').innerHTML = html;
    toast(`${r.detected}/${r.with_data} 案例股命中 (${r.rate}%)`, true);
  } catch(e) { toast('案例检测失败', false); }
  document.getElementById('case-loading').style.display = 'none';
}

// ── Risk ──
async function runRiskCheck() {
  try {
    const r = await api('/api/risk');
    let html = '';
    r.checks.forEach(c => {
      const icon = c.status === 'OK' ? '✅' : c.status === 'WARN' ? '⚠️' : '🔴';
      html += `<div style="padding:4px 0;font-size:13px">${icon} ${c.check}: ${c.detail}</div>`;
    });
    html += `<div style="margin-top:8px;color:${r.critical>0?'#f85149':'#3fb950'}">${r.critical>0 ? '🔴 '+r.critical+' CRITICAL' : '✅ 全部正常'}</div>`;
    document.getElementById('risk-results').innerHTML = html;
    toast('风控检查完成', r.critical === 0);
  } catch(e) { toast('风控检查失败', false); }
}

// ── Init ──
loadDashboard();
loadFactors();
</script>
</body>
</html>
